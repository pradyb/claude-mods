name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.mod }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [safety-guard, secret-scrub, notify-router, status-bar, focus-panel]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace
        run: claude plugin validate --strict .

      - name: Validate mod
        run: claude plugin validate --strict ${{ matrix.mod }}

      - name: Test mod
        run: claude plugin test ${{ matrix.mod }}
